# 贷后案件管理系统 - Docker 部署配置
version: '3.8'

services:
  # 应用服务（使用云服务器 PostgreSQL）
  app:
    build: .
    container_name: loan-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=5000
      - COZE_PROJECT_DOMAIN_DEFAULT=https://scholargl.cn
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

# 注意：PostgreSQL 数据库已迁移到云服务器 101.96.214.104
# 已移除 docker-compose 中的 postgres 服务
