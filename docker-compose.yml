# 贷后案件管理系统 - Docker 部署配置
version: '3.8'

services:
  # 应用服务
  app:
    build: .
    container_name: loan-system
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=loanadmin
      - DB_PASSWORD=LoanAdmin2024!@#
      - DB_NAME=loandb
      - DATABASE_URL=postgresql://loanadmin:LoanAdmin2024!@#@postgres:5432/loandb
      - COZE_PROJECT_DOMAIN_DEFAULT=https://scholargl.cn
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: loan-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=loanadmin
      - POSTGRES_PASSWORD=LoanAdmin2024!@#
      - POSTGRES_DB=loandb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanadmin -d loandb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
